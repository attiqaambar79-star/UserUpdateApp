<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>User Update App</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4">
            User Update App
        </h2>
        <!-- Loading Message -->
        <div id="loading" class="alert alert-info">
            Loading user data...
        </div>
        <!-- Error Message -->
        <div id="errorMessage"
             class="alert alert-danger d-none">
        </div>
        <!-- User Data -->
        <div id="userData" class="d-none">
            <h5>User Information</h5>
            <p>
                <strong>Name:</strong>
                <span id="userName"></span>
            </p>
            <p>
                <strong>Email:</strong>
                <span id="userEmail"></span>
            </p>
        </div>
        <hr>
        <!-- Update Form -->
        <h5>Update User Name</h5>
        <form id="updateForm">
            <div class="mb-3">
                <label class="form-label">
                    User ID
                </label>
                <input
                    type="text"
                    id="userId"
                    class="form-control"
                    placeholder="Enter User ID"
                    required>
            </div>
            <div class="mb-3">
                <label class="form-label">
                    New Name
                </label>
                <input
                    type="text"
                    id="newName"
                    class="form-control"
                    placeholder="Enter new name"
                    required>
            </div>
            <button type="submit"
                    class="btn btn-primary">
                Update Name
            </button>
        </form>
        <div id="successMessage"
             class="alert alert-success mt-3 d-none">
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
